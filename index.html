<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경력기술서 로우데이터 수집 플랜_260418~ WRITTEN BY RIMI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; color: #1a1a18; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 0.5px solid #e0dfd8; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border-left: 3px solid #e0dfd8; transition: opacity 0.15s; }
  .card:hover { opacity: 0.8; }
  .card.done { border-left: 3px solid #1D9E75; background: #f0faf5; }
  .card.done .item-title { color: #0F6E56; }
  .card.done .item-sub { color: #1D9E75; opacity: 0.7; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; display: inline-block; }
  .badge-done { background: #1D9E75; color: #fff; }
  .badge-todo { background: #f1efe8; color: #888780; }
  .item-title { font-size: 14px; font-weight: 500; color: #1a1a18; }
  .item-sub { font-size: 12px; color: #aaa; }
  .stats { background: #f1efe8; border-radius: 10px; padding: 14px 16px; }
  .stats-row { display: flex; gap: 24px; margin-bottom: 10px; }
  .stat-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
  .stat-val { font-size: 22px; font-weight: 500; color: #1a1a18; }
  .stat-val.green { color: #1D9E75; }
  .progress-bg { height: 4px; background: #d3d1c7; border-radius: 2px; }
  .progress-fill { height: 4px; background: #1D9E75; border-radius: 2px; transition: width 0.3s; }
  .reset-btn { margin-top: 12px; font-size: 11px; color: #aaa; background: none; border: none; cursor: pointer; text-decoration: underline; }
  .reset-btn:hover { color: #888; }
  .sync-status { font-size: 11px; color: #aaa; margin-top: 8px; }
  .sync-status.saved { color: #1D9E75; }
</style>
</head>
<body>
<div class="container">
  <h1>경력기술서 로우데이터 수집 플랜_260418~ WRITTEN BY RIMI</h1>
  <p class="subtitle">카드 클릭하면 완료 처리돼요 · 어디서든 동기화돼요</p>
  <div class="grid" id="card-grid"></div>
  <div class="stats">
    <div class="stats-row">
      <div>
        <div class="stat-label">완료</div>
        <div class="stat-val green" id="count-done">0</div>
      </div>
      <div>
        <div class="stat-label">남은 것</div>
        <div class="stat-val" id="count-todo">11</div>
      </div>
      <div>
        <div class="stat-label">진행률</div>
        <div class="stat-val" id="count-pct">0%</div>
      </div>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progress-bar" style="width: 0%;"></div>
    </div>
    <div class="sync-status" id="sync-status">불러오는 중...</div>
    <button class="reset-btn" onclick="resetAll()">전체 초기화</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    databaseURL: "https://rimii-daily-default-rtdb.firebaseio.com"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const dbRef = ref(db, 'rawdata-plan/done');

  const items = [
    { day: '완료', title: '브랜드 콘텐츠 제작', sub: 'SEO 로우데이터' },
    { day: '1일차', title: '브랜드 콘텐츠 제작', sub: '기획 블로그' },
    { day: '2일차', title: '검색광고 / 카피라이팅', sub: '파워링크 문구' },
    { day: '3일차', title: '위키 / 칼럼 콘텐츠', sub: '나무위키 & 브런치' },
    { day: '4일차', title: '글로벌 PR', sub: '해외 기사 배포' },
    { day: '5일차', title: '체험단 운영', sub: '가이드라인 & 섭외' },
    { day: '6일차', title: '파워콘텐츠', sub: '이미지 기획 정리' },
    { day: '7일차', title: '비주얼 콘텐츠', sub: '카드뉴스 이미지' },
    { day: '8일차', title: '브랜드 카피라이팅', sub: '다채널 문구 작성' },
    { day: '9일차', title: '자격 / 인증', sub: '검색광고마케터 1급' },
    { day: '10일차', title: '동영상', sub: '네이버 클립 숏폼' },
  ];

  let doneMap = {};
  const grid = document.getElementById('card-grid');
  const syncStatus = document.getElementById('sync-status');

  function render() {
    grid.innerHTML = '';
    items.forEach((item, i) => {
      const isDone = !!doneMap[i];
      const card = document.createElement('div');
      card.className = 'card' + (isDone ? ' done' : '');
      card.innerHTML = `
        <div><span class="badge ${isDone ? 'badge-done' : 'badge-todo'}">${isDone ? '완료' : item.day}</span></div>
        <div class="item-title">${item.title}</div>
        <div class="item-sub">${item.sub}</div>
      `;
      card.addEventListener('click', () => {
        doneMap[i] = !doneMap[i];
        if (!doneMap[i]) delete doneMap[i];
        saveToFirebase();
        updateStats();
        render();
      });
      grid.appendChild(card);
    });
  }

  function updateStats() {
    const total = items.length;
    const done = Object.keys(doneMap).filter(k => doneMap[k]).length;
    const todo = total - done;
    const pct = Math.round((done / total) * 100);
    document.getElementById('count-done').textContent = done;
    document.getElementById('count-todo').textContent = todo;
    document.getElementById('count-pct').textContent = pct + '%';
    document.getElementById('progress-bar').style.width = pct + '%';
  }

  function saveToFirebase() {
    set(dbRef, doneMap).then(() => {
      syncStatus.textContent = '저장됨 ✓';
      syncStatus.className = 'sync-status saved';
      setTimeout(() => {
        syncStatus.textContent = '동기화 완료';
        syncStatus.className = 'sync-status';
      }, 2000);
    });
  }

  window.resetAll = function() {
    if (confirm('전체 초기화할까요?')) {
      doneMap = {};
      saveToFirebase();
      updateStats();
      render();
    }
  };

  // Firebase에서 실시간으로 불러오기
  onValue(dbRef, (snapshot) => {
    doneMap = snapshot.val() || {};
    syncStatus.textContent = '동기화 완료';
    syncStatus.className = 'sync-status';
    updateStats();
    render();
  });
</script>
</body>
</html>
