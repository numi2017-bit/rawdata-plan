<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경력기술서 로우데이터 수집 플랜_260418~ WRITTEN BY RIMI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; min-height: 100vh; padding: 2rem 1rem; }
  .container { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 500; color: #1a1a18; margin-bottom: 4px; }
  .subtitle { font-size: 13px; color: #888780; margin-bottom: 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 1.5rem; }
  .card { background: #fff; border: 0.5px solid #e0dfd8; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; border-left: 3px solid #e0dfd8; transition: opacity 0.15s; }
  .card:hover { opacity: 0.8; }
  .card.done { border-left: 3px solid #1D9E75; background: #f0faf5; }
  .card.done .item-title { color: #0F6E56; }
  .card.done .day-num { color: #1D9E75; opacity: 0.8; }
  .card.done .item-sub { color: #1D9E75; opacity: 0.7; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; display: inline-block; }
  .badge-done { background: #1D9E75; color: #fff; }
  .badge-todo { background: #f1efe8; color: #888780; }
  .day-num { font-size: 11px; color: #aaa; }
  .item-title { font-size: 14px; font-weight: 500; color: #1a1a18; }
  .item-sub { font-size: 12px; color: #aaa; }
  .stats { background: #f1efe8; border-radius: 10px; padding: 14px 16px; }
  .stats-row { display: flex; gap: 24px; margin-bottom: 10px; }
  .stat-label { font-size: 11px; color: #aaa; margin-bottom: 2px; }
  .stat-val { font-size: 22px; font-weight: 500; color: #1a1a18; }
  .stat-val.green { color: #1D9E75; }
  .progress-bg { height: 4px; background: #d3d1c7; border-radius: 2px; }
  .progress-fill { height: 4px; background: #1D9E75; border-radius: 2px; transition: width 0.3s; }
</style>
</head>
<body>
<div class="container">
  <h1>경력기술서 로우데이터 수집 플랜_260418~ WRITTEN BY RIMI</h1>
  <p class="subtitle">카드 클릭하면 완료 처리돼요</p>
  <div class="grid" id="card-grid"></div>
  <div class="stats">
    <div class="stats-row">
      <div>
        <div class="stat-label">완료</div>
        <div class="stat-val green" id="count-done">1</div>
      </div>
      <div>
        <div class="stat-label">남은 것</div>
        <div class="stat-val" id="count-todo">10</div>
      </div>
      <div>
        <div class="stat-label">진행률</div>
        <div class="stat-val" id="count-pct">9%</div>
      </div>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progress-bar" style="width: 9%;"></div>
    </div>
  </div>
</div>

<script>
const items = [
  { day: '완료', title: '브랜드 콘텐츠 제작', sub: 'SEO 로우데이터', done: true },
  { day: '1일차', title: '브랜드 콘텐츠 제작', sub: '기획 블로그', done: false },
  { day: '2일차', title: '검색광고 / 카피라이팅', sub: '파워링크 문구', done: false },
  { day: '3일차', title: '위키 / 칼럼 콘텐츠', sub: '나무위키 & 브런치', done: false },
  { day: '4일차', title: '글로벌 PR', sub: '해외 기사 배포', done: false },
  { day: '5일차', title: '체험단 운영', sub: '가이드라인 & 섭외', done: false },
  { day: '6일차', title: '파워콘텐츠', sub: '이미지 기획 정리', done: false },
  { day: '7일차', title: '비주얼 콘텐츠', sub: '카드뉴스 이미지', done: false },
  { day: '8일차', title: '브랜드 카피라이팅', sub: '다채널 문구 작성', done: false },
  { day: '9일차', title: '자격 / 인증', sub: '검색광고마케터 1급', done: false },
  { day: '10일차', title: '동영상', sub: '네이버 클립 숏폼', done: false },
];

const grid = document.getElementById('card-grid');

function render() {
  grid.innerHTML = '';
  items.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card' + (item.done ? ' done' : '');
    card.innerHTML = `
      <div><span class="badge ${item.done ? 'badge-done' : 'badge-todo'}">${item.done ? '완료' : item.day}</span></div>
      <div class="item-title">${item.title}</div>
      <div class="item-sub">${item.sub}</div>
    `;
    card.addEventListener('click', () => {
      items[i].done = !items[i].done;
      updateStats();
      render();
    });
    grid.appendChild(card);
  });
}

function updateStats() {
  const total = items.length;
  const done = items.filter(i => i.done).length;
  const todo = total - done;
  const pct = Math.round((done / total) * 100);
  document.getElementById('count-done').textContent = done;
  document.getElementById('count-todo').textContent = todo;
  document.getElementById('count-pct').textContent = pct + '%';
  document.getElementById('progress-bar').style.width = pct + '%';
}

render();
</script>
</body>
</html>
